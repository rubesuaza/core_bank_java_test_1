spring:
  application:
    name: core-bank

  datasource:
    url: jdbc:postgresql://localhost:5432/core_bank
    username: core_bank_user
    password: core_bank_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false

server:
  port: 8080

